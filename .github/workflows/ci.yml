name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Java backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit, API, search and accuracy tests, then the runnable jar.
      - run: mvn -B -ntp verify
      - name: Smoke test the server
        run: |
          java -jar target/hibernate-express.jar serve --port 8099 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8099/api/health && break || sleep 1; done
          curl -fsS http://localhost:8099/api/health | grep -q '"ok":true'

  frontend:
    name: Phone app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
